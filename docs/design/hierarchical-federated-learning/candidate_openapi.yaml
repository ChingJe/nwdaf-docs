openapi: 3.0.0

info:
  title: Nnwdaf_MLModelTraining Hierarchical FL Candidate
  version: 0.1.0
  description: |
    Candidate extension of the 3GPP Release 18 Nnwdaf_MLModelTraining API for
    hierarchical federated learning orchestration. This document is a project
    proposal and is not a 3GPP specification.

x-documentation:
  protocolDesign: ./protocol_design.md
  schemaSemantics: ./candidate_openapi_schema.md
  conformanceMatrix: ./protocol_conformance_matrix.md

servers:
  - url: '{apiRoot}/nnwdaf-mlmodeltraining/v1'
    variables:
      apiRoot:
        default: https://example.com
        description: apiRoot as defined in clause 4.4 of 3GPP TS 29.501

security:
  - {}
  - oAuth2ClientCredentials:
      - nnwdaf-mlmodeltraining

x-baseline:
  specification: 3GPP TS 29.520 V18.14.0
  apiVersion: 1.0.5
  source: ../../../specs/openapi/TS29520_Nnwdaf_MLModelTraining.yaml

x-supported-features:
  - featureNumber: 3
    featureName: HierarchicalFLOrch
    bitmask: '4'
    description: >
      Supports recursive topology instructions and reports, node-scoped
      policy, strategy and report-after settings, and retained-result lookup.

x-stage3-rules:
  - >
    The x-flTopology root nfInstanceId shall identify the request receiver;
    the x-flTopologyReport root nfInstanceId shall identify the direct Client
    bound to the subscription callback context.
  - >
    A topology instruction or report shall not contain duplicate nfInstanceId
    values or an ancestor cycle.
  - >
    policy and strategy apply to the node acting as the FL Server for its
    direct children; reportAfter applies to the node reporting to its direct
    parent.
  - >
    When selectionMethod is priority, each enabled explicit child shall
    provide priority, and minAvailableNodes shall be greater than or equal to
    minTrainNodes.
  - >
    retainedResultReq and x-retainedResultReq are operation-scoped and shall
    not be persisted as subscription state.
  - >
    A notification shall contain at least one of delayEventNotif,
    mLModelInfos, termTrainReq, x-flTopologyReport or x-retainedResultStatus.
    The existing mutual-exclusion rules for delayEventNotif, mLModelInfos and
    termTrainReq remain applicable.
  - >
    A Create or PUT operation containing x-flTopology or a true
    x-retainedResultReq shall contain mlCorreId. A PATCH operation using
    either extension is valid only when the existing subscription is already
    correlated with an FL procedure.
  - >
    A notification containing x-flTopologyReport or x-retainedResultStatus
    shall contain mlCorreId.
  - >
    When x-retainedResultStatus is FOUND, roundInd and mLModelInfos shall be
    present. When it is NOT_FOUND or FAILED, roundInd and mLModelInfos shall
    be absent.
  - >
    A FlTopologyReportNode with status FAILED or INACTIVE shall contain
    statusCause. A node with a status defined by this version other than
    FAILED or INACTIVE shall not contain statusCause.
  - >
    retainedResultReq shall not be true for a child whose enabled value is
    false.
  - >
    A local subscription shall have at most one outstanding retained-result
    lookup. A subsequent lookup may start only after the previous outcome has
    been received.
  - >
    The HierarchicalFLOrch feature shall be negotiated independently on every
    parent-to-child subscription resource.

paths:
  /subscriptions:
    post:
      summary: Create an Individual NWDAF ML Model Training Subscription resource.
      operationId: CreateNWDAFMLModelTrainingSubcription
      tags:
        - Subscriptions (Collection)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NwdafMLModelTrainSubsc'
            examples:
              hierarchicalTopology:
                $ref: '#/components/examples/HierarchicalTopologySubscription'
      responses:
        '201':
          description: The subscription resource was created successfully.
          headers:
            Location:
              description: URI of the created subscription resource.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NwdafMLModelTrainSubsc'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '411':
          $ref: '#/components/responses/LengthRequired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/DefaultError'
      callbacks:
        myNotification:
          '{$request.body#/notifUri}':
            post:
              summary: Notify the ML Model Training service consumer.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/NwdafMLModelTrainNotif'
                    examples:
                      topologyReport:
                        $ref: '#/components/examples/TopologyReportNotification'
                      retainedResultFound:
                        $ref: '#/components/examples/RetainedResultFoundNotification'
                      retainedResultNotFound:
                        $ref: '#/components/examples/RetainedResultNotFoundNotification'
                      retainedResultFailed:
                        $ref: '#/components/examples/RetainedResultFailedNotification'
              responses:
                '204':
                  description: No Content, notification was successful.
                '307':
                  $ref: '#/components/responses/TemporaryRedirect'
                '308':
                  $ref: '#/components/responses/PermanentRedirect'
                '400':
                  $ref: '#/components/responses/BadRequest'
                '401':
                  $ref: '#/components/responses/Unauthorized'
                '403':
                  $ref: '#/components/responses/Forbidden'
                '404':
                  $ref: '#/components/responses/NotFound'
                '411':
                  $ref: '#/components/responses/LengthRequired'
                '413':
                  $ref: '#/components/responses/PayloadTooLarge'
                '415':
                  $ref: '#/components/responses/UnsupportedMediaType'
                '429':
                  $ref: '#/components/responses/TooManyRequests'
                '500':
                  $ref: '#/components/responses/InternalServerError'
                '502':
                  $ref: '#/components/responses/BadGateway'
                '503':
                  $ref: '#/components/responses/ServiceUnavailable'
                default:
                  $ref: '#/components/responses/DefaultError'

  /subscriptions/{subscriptionId}:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    put:
      summary: Replace an Individual NWDAF ML Model Training Subscription resource.
      operationId: UpdateNWDAFMLModelTrainingSubcription
      tags:
        - Individual NWDAF ML Model Training Subscription (Document)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NwdafMLModelTrainSubsc'
      responses:
        '200':
          description: The subscription resource was replaced successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NwdafMLModelTrainSubsc'
        '204':
          description: The subscription resource was replaced successfully.
        '307':
          $ref: '#/components/responses/TemporaryRedirect'

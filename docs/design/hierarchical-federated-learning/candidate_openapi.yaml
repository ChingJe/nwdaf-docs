components:
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: '{nrfApiRoot}/oauth2/token'
          scopes:
            nnwdaf-mlmodeltraining: Access to the Nnwdaf_MLModelTraining API

  parameters:
    SubscriptionId:
      name: subscriptionId
      in: path
      description: String identifying a subscription to the Nnwdaf_MLModelTraining Service.
      required: true
      schema:
        type: string

  responses:
    TemporaryRedirect:
      $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/responses/307'
    PermanentRedirect:
      $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/responses/308'
    BadRequest:
      $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/responses/400'
    Unauthorized:
      $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/responses/401'
    Forbidden:
      $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/responses/403'
    NotFound:
      $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/responses/404'
    LengthRequired:
      $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/responses/411'
    PayloadTooLarge:
      $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/responses/413'
    UnsupportedMediaType:
      $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/responses/415'
    TooManyRequests:
      $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/responses/429'
    InternalServerError:
      $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/responses/500'
    BadGateway:
      $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/responses/502'
    ServiceUnavailable:
      $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/responses/503'
    DefaultError:
      $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/responses/default'

  schemas:
    NwdafMLModelTrainSubsc:
      description: >
        Represents a Release 18 ML Model Training subscription extended with
        hierarchical FL orchestration instructions.
      type: object
      properties:
        mLEventSubscs:
          type: array
          items:
            $ref: '../../../specs/openapi/TS29520_Nnwdaf_MLModelProvision.yaml#/components/schemas/MLEventSubscription'
          minItems: 1
        notifUri:
          $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/schemas/Uri'
        suppFeats:
          $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/schemas/SupportedFeatures'
        eventReq:
          $ref: '../../../specs/openapi/TS29523_Npcf_EventExposure.yaml#/components/schemas/ReportingInformation'
        failEventReports:
          type: array
          items:
            $ref: '../../../specs/openapi/TS29520_Nnwdaf_MLModelTraining.yaml#/components/schemas/FailureEventInfoForMLModelTrain'
          minItems: 1
        mlCorreId:
          type: string
          description: String identifying the subscription as part of a Federated Learning procedure.
        mLModelInfos:
          type: array
          items:
            $ref: '../../../specs/openapi/TS29520_Nnwdaf_MLModelProvision.yaml#/components/schemas/MLEventNotif'
          minItems: 1
        immReport:
          $ref: '#/components/schemas/NwdafMLModelTrainNotif'
        mLModelTrainInfos:
          type: array
          items:
            $ref: '../../../specs/openapi/TS29520_Nnwdaf_MLModelTraining.yaml#/components/schemas/MLModelTrainInfo'
          minItems: 1
        mLPreFlag:
          type: boolean
        mLAccChkFlg:
          type: boolean
        mLTrainRepInfo:
          $ref: '../../../specs/openapi/TS29520_Nnwdaf_MLModelTraining.yaml#/components/schemas/MLTrainReportInfo'
        notifCorreId:
          type: string
        roundInd:
          $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/schemas/Uinteger'
        tgtRepUe:
          $ref: '../../../specs/openapi/TS29520_Nnwdaf_EventsSubscription.yaml#/components/schemas/TargetUeInformation'
        skipFlInd:
          type: boolean
        x-flTopology:
          $ref: '#/components/schemas/FlTopologyNode'
        x-retainedResultReq:
          type: boolean
          writeOnly: true
          description: >
            Indicates whether the recipient shall perform one retained-result
            lookup for this operation.
      required:
        - mLEventSubscs
        - notifUri
        - notifCorreId

    NwdafMLModelTrainSubscPatch:
      description: >
        Represents parameters to request a partial update of an ML Model
        Training subscription, including hierarchical FL instructions.
      type: object
      properties:
        notifUri:
          $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/schemas/Uri'
        eventReq:
          $ref: '../../../specs/openapi/TS29523_Npcf_EventExposure.yaml#/components/schemas/ReportingInformation'
        mLModelInfos:
          type: array
          items:
            $ref: '../../../specs/openapi/TS29520_Nnwdaf_MLModelProvision.yaml#/components/schemas/MLEventNotif'
          minItems: 1
        mLModelTrainInfos:
          type: array
          items:
            $ref: '../../../specs/openapi/TS29520_Nnwdaf_MLModelTraining.yaml#/components/schemas/MLModelTrainInfo'
          minItems: 1
        mLPreFlag:
          type: boolean
        mLAccChkFlg:
          type: boolean
        mLTrainRepInfo:
          $ref: '../../../specs/openapi/TS29520_Nnwdaf_MLModelTraining.yaml#/components/schemas/MLTrainReportInfo'
        roundInd:
          $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/schemas/Uinteger'
        tgtRepUe:
          $ref: '../../../specs/openapi/TS29520_Nnwdaf_EventsSubscription.yaml#/components/schemas/TargetUeInformation'
        skipFlInd:
          type: boolean
        x-flTopology:
          $ref: '#/components/schemas/FlTopologyNode'
        x-retainedResultReq:
          type: boolean
          writeOnly: true
          description: >
            Indicates whether the recipient shall perform one retained-result
            lookup for this partial-update operation.

    NwdafMLModelTrainNotif:
      description: >
        Represents ML Model Training notifications, including hierarchical FL
        topology reports and retained-result outcomes.
      type: object
      properties:
        delayEventNotif:
          $ref: '../../../specs/openapi/TS29520_Nnwdaf_MLModelTraining.yaml#/components/schemas/DelayEventNotif'
        mlCorreId:
          type: string
        mLModelInfos:
          type: array
          items:
            $ref: '../../../specs/openapi/TS29520_Nnwdaf_MLModelProvision.yaml#/components/schemas/MLEventNotif'
          minItems: 1
        notifCorreId:
          type: string
        roundInd:
          $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/schemas/Uinteger'
        statusReport:
          $ref: '../../../specs/openapi/TS29520_Nnwdaf_MLModelTraining.yaml#/components/schemas/StatusReportInfo'
        termTrainReq:
          $ref: '../../../specs/openapi/TS29520_Nnwdaf_MLModelTraining.yaml#/components/schemas/TermTrainCause'
        x-flTopologyReport:
          $ref: '#/components/schemas/FlTopologyReport'
        x-retainedResultStatus:
          $ref: '#/components/schemas/RetainedResultStatus'
      required:
        - notifCorreId

    FlTopologyNode:
      description: >
        Represents a role-neutral node in a recursive hierarchical FL topology
        instruction.
      type: object
      additionalProperties: false
      properties:
        nfInstanceId:
          $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/schemas/NfInstanceId'
        enabled:
          type: boolean
          default: true
        priority:
          type: integer
          minimum: 0
        policy:
          $ref: '#/components/schemas/FlPolicy'
        strategy:
          $ref: '#/components/schemas/FlStrategy'
        reportAfter:
          $ref: '#/components/schemas/FlReportAfter'
        retainedResultReq:
          type: boolean
          writeOnly: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/FlTopologyNode'
          minItems: 1
      required:
        - nfInstanceId

    FlPolicy:
      description: >
        Represents participant selection and result acceptance decisions
        applied by a node acting as FL Server for its direct children.
      type: object
      additionalProperties: false
      properties:
        allowAdditionalCandidates:
          type: boolean
          default: false
        additionalCandidatePriority:
          type: integer
          minimum: 0
          default: 0
        selectionMethod:
          $ref: '#/components/schemas/FlSelectionMethod'
        minAvailableNodes:
          type: integer
          minimum: 1
        fractionTrain:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
        minTrainNodes:
          type: integer
          minimum: 1
        acceptFailures:
          type: boolean
        minCompletionRate:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
          maximum: 1

    FlSelectionMethod:
      description: Represents the method used to select eligible FL Clients.
      anyOf:
        - type: string
          enum: [priority, random]
        - type: string
          description: >
            This string provides forward-compatibility with future extensions
            to the enumeration but is not used to encode content defined in
            this version of the API.

    FlStrategy:
      description: Represents the training and aggregation contract of a local FL process.
      oneOf:
        - $ref: '#/components/schemas/FedProxStrategy'
      discriminator:
        propertyName: method
        mapping:
          fedProx: '#/components/schemas/FedProxStrategy'

    FedProxStrategy:
      type: object
      additionalProperties: false
      properties:
        method:
          type: string
          enum: [fedProx]
        aggregation:
          $ref: '#/components/schemas/FlAggregation'
        methodParameters:
          $ref: '#/components/schemas/FedProxParameters'
      required:
        - method
        - aggregation
        - methodParameters

    FlAggregation:
      description: Represents the aggregation rule used by the FL Server.
      anyOf:
        - type: string
          enum: [sampleWeighted]
        - type: string
          description: >
            This string provides forward-compatibility with future extensions
            to the enumeration but is not used to encode content defined in
            this version of the API.

    FedProxParameters:
      description: Represents parameters required by the FedProx method.
      type: object
      additionalProperties: false
      properties:
        proximalMu:
          type: number
          format: float
          minimum: 0
      required:
        - proximalMu

    FlReportAfter:
      description: >
        Represents the amount of node-local work to complete before reporting
        to the direct parent.
      type: object
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 1
        unit:
          $ref: '#/components/schemas/FlReportUnit'
      required:
        - count
        - unit

    FlReportUnit:
      description: Represents the unit used by a report-after instruction.
      anyOf:
        - type: string
          enum: [epoch, round]
        - type: string
          description: >
            This string provides forward-compatibility with future extensions
            to the enumeration but is not used to encode content defined in
            this version of the API.

    FlTopologyReport:
      description: >
        Represents the reporting node and the recursive states of the
        candidates managed by that node.
      type: object
      additionalProperties: false
      properties:
        nfInstanceId:
          $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/schemas/NfInstanceId'
        policy:
          $ref: '#/components/schemas/FlPolicy'
        strategy:
          $ref: '#/components/schemas/FlStrategy'
        reportAfter:
          $ref: '#/components/schemas/FlReportAfter'
        children:
          type: array
          items:
            $ref: '#/components/schemas/FlTopologyReportNode'
          minItems: 1
      required:
        - nfInstanceId

    FlTopologyReportNode:
      description: >
        Represents a node in a recursive report of a realized hierarchical FL
        topology and its candidate states.
      type: object
      additionalProperties: false
      properties:
        nfInstanceId:
          $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/schemas/NfInstanceId'
        status:
          $ref: '#/components/schemas/FlTopologyStatus'
        statusTimestamp:
          $ref: '../../../specs/openapi/TS29571_CommonData.yaml#/components/schemas/DateTime'
        statusCause:
          $ref: '#/components/schemas/FlTopologyStatusCause'
        policy:
          $ref: '#/components/schemas/FlPolicy'
        strategy:
          $ref: '#/components/schemas/FlStrategy'
        reportAfter:
          $ref: '#/components/schemas/FlReportAfter'
        children:
          type: array
          items:
            $ref: '#/components/schemas/FlTopologyReportNode'
          minItems: 1
      required:
        - nfInstanceId
        - status
        - statusTimestamp

    FlTopologyStatus:
      description: Represents the lifecycle state of a hierarchical FL candidate.
      anyOf:
        - type: string
          enum: [UNCONFIRMED, DEPLOYING, ACTIVE, FAILED, INACTIVE]
        - type: string
          description: >
            This string provides forward-compatibility with future extensions
            to the enumeration but is not used to encode content defined in
            this version of the API.

    FlTopologyStatusCause:
      description: Represents why a hierarchical FL relationship entered FAILED or INACTIVE.
      anyOf:
        - type: string
          enum:
            - SUBSCRIPTION_REJECTED
            - RESPONSE_TIMEOUT
            - COMMUNICATION_FAILURE
            - NWDAF_OVERLOAD
            - NOT_AVAILABLE_ML_TRAIN
            - PARTICIPANT_WITHDRAWN
            - REMOVED_BY_POLICY
            - FEATURE_NOT_SUPPORTED
            - OTHER
        - type: string
          description: >
            This string provides forward-compatibility with future extensions
            to the enumeration but is not used to encode content defined in
            this version of the API.

    RetainedResultStatus:
      description: Represents the outcome of a retained-result lookup.
      anyOf:
        - type: string
          enum: [FOUND, NOT_FOUND, FAILED]
        - type: string
          description: >
            This string provides forward-compatibility with future extensions
            to the enumeration but is not used to encode content defined in
            this version of the API.

  examples:
    HierarchicalTopologySubscription:
      summary: Root assigns candidates and delegates participant selection.
      value:
        mLEventSubscs:
          - mLEvent: UE_COMMUNICATION

openapi: 3.0.0

info:
  title: ADAE AIMLE Client Energy Sustainablity Analytics
  version: 1.0.0-alpha.1
  description: |
    ADAE Server provides AIMLE Client Energy Sustainablity analytics.  
    © 2026, 3GPP Organizational Partners (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC).  
    All rights reserved.

externalDocs:
  description: >
    3GPP TS 29.549 v20.1.0; Service Enabler Architecture Layer for Verticals (SEAL); Application
    Programming Interface (API) specification; Stage 3.
  url: https://www.3gpp.org/ftp/Specs/archive/29_series/29.549/

servers:
  - url: '{apiRoot}/ss-adae-acesa/v1'
    variables:
      apiRoot:
        default: https://example.com
        description: apiRoot as defined in clause 6.5 of 3GPP TS 29.549

security:
  - {}
  - oAuth2ClientCredentials: []


paths:
  /energy-sust-analytics:
    get:
      summary: Get ADAE AIMLE Client Energy Sustainability Analytics.
      operationId: GetAIMLEClientEnergySustainabilityAnalytics
      tags:
        - Get ADAE AIMLE Client Energy Sustainability Analytics
      parameters:
        - name: filt-criteria
          in: query
          description: >
             Represents the filtering criteria for AIMLE Client Energy Sustainability Analytics.
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimleClientEnergySustReq'
        - name: supported-features
          in: query
          description: >
            Contains supported features information, used to negotiate the applicability
            of optional features.
          schema:
            $ref: 'TS29571_CommonData.yaml#/components/schemas/SupportedFeatures'
      responses:
        '200':
          description: >
            The response body contains AIMLE Client Energy Sustainability analytics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AimleClientEnergySustResp'
        '307':
          $ref: 'TS29122_CommonData.yaml#/components/responses/307'
        '308':
          $ref: 'TS29122_CommonData.yaml#/components/responses/308'
        '400':
          $ref: 'TS29122_CommonData.yaml#/components/responses/400'
        '401':
          $ref: 'TS29122_CommonData.yaml#/components/responses/401'
        '403':
          $ref: 'TS29122_CommonData.yaml#/components/responses/403'
        '404':
          $ref: 'TS29122_CommonData.yaml#/components/responses/404'
        '406':
          $ref: 'TS29122_CommonData.yaml#/components/responses/406'
        '429':
          $ref: 'TS29122_CommonData.yaml#/components/responses/429'
        '500':
          $ref: 'TS29122_CommonData.yaml#/components/responses/500'
        '503':
          $ref: 'TS29122_CommonData.yaml#/components/responses/503'
        default:
          $ref: 'TS29122_CommonData.yaml#/components/responses/default'

components:
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: '{tokenUrl}'
          scopes: {}

  schemas:
    AimleClientEnergySustReq:
      description: Represents the AIMLE Client Energy Sustainability Request.
      type: object
      properties:
        analyticsType:
          $ref: 'TS29549_SS_ADAE_VALPerformanceAnalytics.yaml#/components/schemas/AnalyticsType'
        valUeIds:
          type: array
          minItems: 1
          items:
            $ref: 'TS29549_SS_UserProfileRetrieval.yaml#/components/schemas/ValTargetUe'
        valAddrInfos:
          type: array
          minItems: 1
          items:
            $ref: 'TS29549_SS_NetworkResourceAdaptation.yaml#/components/schemas/ValUeAddrInfo'
        srvId:
          type: string
        ueMobs:
          type: object
          additionalProperties:
            $ref: 'TS29520_Nnwdaf_EventsSubscription.yaml#/components/schemas/UeMobility'
          minProperties: 1
          description: >
            Contains the mobility and route information of the target VAL UEs.
            The key of the map shall be set to the value of the identifier of the VAL UE 
            (among the ones provided within the valUeIds attribute or the VAL UE address identified
            by the valAddrInfos attribute) to which the mobility and route information
            provided within the map value is related.
        dataColReq:
          $ref: 'TS29549_SS_ADCCF_DataCollection.yaml#/components/schemas/DataCollectionReq'
        confLevel:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/Uinteger'
        area:
          $ref: 'TS29122_CommonData.yaml#/components/schemas/LocationArea5G'
        reportReqs:
          $ref: 'TS29549_SS_NetworkResourceMonitoring.yaml#/components/schemas/ReportingRequirements'
      required:
        - analyticsType
      anyOf:
        - required: [valUeIds]
        - required: [valAddrInfos]

    AimleClientEnergySustResp:
      description: Represents the AIMLE Client Energy Sustainability Response.
      type: object
      properties:
        analyticsOutput:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EnergySustainabilityAnalytics'
        valUeIds:
          type: array
          minItems: 1
          items:
            $ref: 'TS29549_SS_UserProfileRetrieval.yaml#/components/schemas/ValTargetUe'
        confLevel:
          $ref: 'TS29571_CommonData.yaml#/components/schemas/Uinteger'
      required:
        - analyticsOutput

    EnergySustainabilityAnalytics:
      description: Represents the AIMLE Client Energy Sustainability.
      type: object
      properties:
        sustInd:
          type: boolean
        reco:
          type: string
      required:
        - reco


# Simple data types 
#

# Enumerations
#


